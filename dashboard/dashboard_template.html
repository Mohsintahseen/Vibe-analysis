<meta charset="utf-8">
<title>Vibe Analysis Dashboard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: sticky filter row over a hero KPI strip, then a trend + region band and a category + products band. */
:root{
  --page:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,.10); --border-strong:rgba(11,11,11,.24);
  --rev:#2a78d6; --pro:#008300; --ord:#6250d6; --good:#006300; --crit:#d03b3b; --warn:#fab219;
  --font-sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#0d0d0d; --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10); --border-strong:rgba(255,255,255,.26);
    --rev:#3987e5; --pro:#008300; --ord:#9085e9; --good:#0ca30c; --crit:#e66767; --warn:#fab219;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --page:#0d0d0d; --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10); --border-strong:rgba(255,255,255,.26);
  --rev:#3987e5; --pro:#008300; --ord:#9085e9; --good:#0ca30c; --crit:#e66767; --warn:#fab219;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--page); color:var(--ink); font-family:var(--font-sans); font-size:14px; line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:24px 40px;
}
.wrap{max-width:1240px;margin:0 auto}
h1{font-size:26px;font-weight:600;letter-spacing:-.01em;margin:0;line-height:1.15}
h2{font-size:14px;font-weight:600;margin:0}
p{margin:0}
.sub{color:var(--ink2);font-size:12.5px}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:8px 16px;margin-bottom:14px}
.top .sub{margin-top:4px}

.filters{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--page);
  display:flex; flex-wrap:wrap; gap:10px 18px; align-items:center;
  padding:10px 0; margin-bottom:14px; border-bottom:1px solid var(--border);
}
.fld{display:flex;align-items:center;gap:8px}
.fld>span,.fld>label,.flab{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.seg{display:inline-flex;border:1px solid var(--border-strong);border-radius:6px;overflow:hidden}
.seg button{font:inherit;font-size:13px;background:var(--surface);color:var(--ink2);border:0;padding:6px 12px;cursor:pointer;white-space:nowrap}
.seg button+button{border-left:1px solid var(--border-strong)}
.seg button:hover{background:var(--grid);color:var(--ink)}
.seg button[aria-checked="true"]{background:var(--ink);color:var(--surface);font-weight:500}
select{font:inherit;font-size:13px;padding:6px 10px;border:1px solid var(--border-strong);border-radius:6px;background:var(--surface);color:var(--ink);cursor:pointer;max-width:100%}
button:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--rev);outline-offset:2px}
.reset{font:inherit;font-size:13px;background:none;border:0;color:var(--ink2);text-decoration:underline;cursor:pointer;padding:6px 4px}
.reset:hover{color:var(--ink)}
.count{margin-left:auto;font-size:12.5px;color:var(--ink2)}
.count b{font-weight:600;color:var(--ink)}

.kpis{display:grid;grid-template-columns:1.5fr repeat(3,1fr);gap:12px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;display:flex;flex-direction:column;min-width:0}
.tl{font-size:13px;color:var(--ink2)}
.tv{font-size:30px;font-weight:600;letter-spacing:-.015em;line-height:1.15;margin-top:4px}
.tile.hero .tv{font-size:52px;letter-spacing:-.025em;line-height:1.05}
.td{font-size:12.5px;margin-top:6px;min-height:18px;color:var(--ink2)}
.dl{font-weight:500}
.dl.up{color:var(--good)} .dl.dn{color:var(--crit)}
.sp{margin-top:auto;padding-top:12px;min-width:0}
.sp svg{display:block;width:100%}

.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px;margin-top:12px}
.c8{grid-column:span 8}.c4{grid-column:span 4}.c5{grid-column:span 5}.c7{grid-column:span 7}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;min-width:0}
.ch{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:8px 12px;margin-bottom:10px}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg.sm button{padding:4px 10px;font-size:12px}
.tbtn{font:inherit;font-size:12px;background:var(--surface);color:var(--ink2);border:1px solid var(--border-strong);border-radius:6px;padding:4px 10px;cursor:pointer}
.tbtn:hover{color:var(--ink);background:var(--grid)}
.plot{min-width:0}
.plot svg{display:block;overflow:visible}

svg .grid-l{stroke:var(--grid);stroke-width:1;fill:none}
svg .axis-l{stroke:var(--axis);stroke-width:1;fill:none}
svg .tick{fill:var(--muted);font-family:var(--font-mono);font-size:11px}
svg .ann{fill:var(--ink2);font-size:11.5px;font-weight:500}
svg .lbl{fill:var(--ink);font-size:13px}
svg .val{fill:var(--ink);font-size:13px;font-weight:500;font-family:var(--font-sans)}
svg .valsub{fill:var(--ink2);font-weight:400;font-size:12px}
svg .hit{fill:transparent}
svg .ring{stroke:var(--surface);stroke-width:2}
.hrow{cursor:pointer;outline:none}
.hrow .bar{transition:opacity .12s}
.hrow:hover .bar{opacity:.82}
.hrow.dim .bar,.hrow.dim .lbl,.hrow.dim .val{opacity:.4}
.hrow:focus-visible .hit{stroke:var(--ink);stroke-width:1.5}
.cross{stroke:var(--ink2);stroke-width:1;fill:none}

.tbl{overflow-x:auto}
.tbl table{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{font-weight:500;color:var(--ink2);text-align:right;padding:6px 8px;border-bottom:1px solid var(--border-strong);white-space:nowrap}
.tbl td{padding:6px 8px;border-bottom:1px solid var(--border);text-align:right;font-family:var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left;font-family:var(--font-sans)}

.prows{display:flex;flex-direction:column}
.prow{display:grid;grid-template-columns:22px minmax(120px,1.3fr) minmax(60px,1.6fr) 64px 116px;gap:0 12px;align-items:center;padding:9px 4px;border-bottom:1px solid var(--border);cursor:default}
.prow:last-child{border-bottom:0}
.prow:hover{background:color-mix(in srgb,var(--grid) 55%,transparent)}
.prk{color:var(--muted);font-family:var(--font-mono);font-size:12px}
.pn{font-weight:500;line-height:1.25;min-width:0}
.pn small{display:block;color:var(--ink2);font-weight:400;font-size:12px}
.ptrack{height:10px;background:var(--grid);border-radius:0 4px 4px 0;min-width:0}
.pfill{height:100%;border-radius:0 4px 4px 0}
.pv{font-weight:500;text-align:right;font-variant-numeric:tabular-nums}
.pm{display:flex;align-items:center;justify-content:flex-end;gap:6px;font-size:12.5px;color:var(--ink2);white-space:nowrap}
.pm .mv{font-family:var(--font-mono);color:var(--ink)}
.flag{display:inline-flex;align-items:center;gap:3px;font-size:11px;color:var(--ink2)}
.flag svg{width:10px;height:10px;flex:none}
.empty{padding:28px 0;color:var(--ink2);text-align:center}

.subh{margin:14px 0 4px;padding-top:12px;border-top:1px solid var(--border);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.foot{margin-top:18px;color:var(--ink2);font-size:12px;max-width:90ch;line-height:1.55}

.tip{position:fixed;left:0;top:0;z-index:30;pointer-events:none;opacity:0;transition:opacity .08s;background:var(--surface);border:1px solid var(--border-strong);border-radius:8px;padding:8px 10px;min-width:150px;max-width:260px;font-size:12px}
.tip.on{opacity:1}
.tip .tt{font-weight:600;margin-bottom:4px;font-size:12.5px}
.tip .tr{display:flex;align-items:center;gap:8px;padding:1px 0}
.tip .tk{width:10px;height:0;border-top:2px solid var(--muted);flex:none}
.tip .tn{color:var(--ink2);flex:1}
.tip .tx{font-family:var(--font-mono);font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}

@media (max-width:980px){
  .c8,.c4,.c5,.c7{grid-column:span 12}
  .kpis{grid-template-columns:1fr 1fr}
  .tile.hero{grid-column:span 2}
  .count{margin-left:0;width:100%}
}
@media (max-width:560px){
  .kpis{grid-template-columns:1fr}
  .tile.hero{grid-column:auto}
  .tile.hero .tv{font-size:44px}
  .prow{grid-template-columns:22px minmax(0,1fr) auto auto}
  .ptrack{grid-column:2 / -1;grid-row:2}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1>Vibe Analysis</h1>
      <p class="sub" id="scope"></p>
    </div>
  </header>

  <section class="filters" aria-label="Filters">
    <div class="fld"><span id="yl">Year</span>
      <div class="seg" role="radiogroup" aria-labelledby="yl" id="yearSeg"></div>
    </div>
    <div class="fld"><label for="regionSel">Region</label><select id="regionSel"></select></div>
    <div class="fld"><label for="catSel">Category</label><select id="catSel"></select></div>
    <button class="reset" id="reset" type="button" hidden>Reset filters</button>
    <p class="count" id="count" aria-live="polite"></p>
  </section>

  <section class="kpis" id="kpis" aria-label="Key figures"></section>

  <div class="grid">
    <article class="card c8">
      <div class="ch">
        <div><h2>Monthly trend</h2><p class="sub" id="trendSub"></p></div>
        <div class="ctrl">
          <div class="seg sm" role="radiogroup" aria-label="Trend metric" id="metricSeg"></div>
          <button class="tbtn" type="button" data-view="trend" aria-pressed="false">Table</button>
        </div>
      </div>
      <div class="plot" id="trendChart"></div>
      <div class="tbl" id="trendTable" hidden></div>
    </article>

    <article class="card c4">
      <div class="ch">
        <div><h2>Profit by region</h2><p class="sub">Profit and margin. Click a bar to filter.</p></div>
        <div class="ctrl"><button class="tbtn" type="button" data-view="region" aria-pressed="false">Table</button></div>
      </div>
      <div class="plot" id="regionChart"></div>
      <div class="tbl" id="regionTable" hidden></div>
    </article>

    <article class="card c5">
      <div class="ch">
        <div><h2>Revenue by category</h2><p class="sub">Revenue and margin. Click a bar to filter.</p></div>
        <div class="ctrl"><button class="tbtn" type="button" data-view="cat" aria-pressed="false">Table</button></div>
      </div>
      <div class="plot" id="catChart"></div>
      <div class="tbl" id="catTable" hidden></div>
      <p class="subh">Sub-category revenue in view</p>
      <div class="plot" id="subChart"></div>
    </article>

    <article class="card c7">
      <div class="ch">
        <div><h2>Top 10 products</h2><p class="sub">Flagged when margin runs 3+ points under the view average.</p></div>
        <div class="ctrl">
          <span class="flab">Rank by</span>
          <div class="seg sm" role="radiogroup" aria-label="Rank products by" id="rankSeg"></div>
        </div>
      </div>
      <div id="prods"></div>
    </article>
  </div>

</div>
<div class="tip" id="tip" role="status"></div>

<script>
(function(){
"use strict";
var D = /*DATA*/null;
var MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var REGIONS=D.regions, CATS=D.cats, PRODUCTS=D.products, ROWS=D.rows, NM=D.months.length;
var COL={revenue:'var(--rev)',profit:'var(--pro)',orders:'var(--ord)'};
var LBL={revenue:'Revenue',profit:'Profit',orders:'Orders'};
var SUBS=[],SUBOF=[];
PRODUCTS.forEach(function(p,i){var j=SUBS.indexOf(p.sub);if(j<0){j=SUBS.length;SUBS.push(p.sub);}SUBOF[i]=j;});
var state={year:'all',region:-1,cat:-1,metric:'revenue',rank:'revenue',view:{trend:false,region:false,cat:false}};

function $(s){return document.querySelector(s);}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function yearOf(m){return m<0?0:(m<12?2024:2025);}
function money(v){var a=Math.abs(v),s=v<0?'-':'';
  if(a>=1e6)return s+'$'+(a/1e6).toFixed(2)+'M';
  if(a>=1e3)return s+'$'+(a/1e3).toFixed(a>=1e5?0:1)+'K';
  return s+'$'+a.toFixed(0);}
function moneyFull(v){return (v<0?'-':'')+'$'+Math.round(Math.abs(v)).toLocaleString('en-US');}
function int(v){return Math.round(v).toLocaleString('en-US');}
function pct(v,d){return (isFinite(v)?v:0).toFixed(d==null?1:d)+'%';}
function mLabel(i,full){var y=D.months[i].slice(0,4),m=+D.months[i].slice(5,7)-1;return MN[m]+(full?' '+y:'');}

/* ---------- aggregation: one pass, every chart gets the slice it should see ---------- */
function aggregate(){
  var sy=state.year,sr=state.region,sc=state.cat,i,k;
  var month=[];for(i=0;i<NM;i++)month.push({rev:0,pro:0,ord:0,c:new Set()});
  var tot={rev:0,pro:0,ord:0,c:new Set()},prev={rev:0,pro:0,ord:0,c:new Set()};
  var reg=REGIONS.map(function(){return{rev:0,pro:0,ord:0};});
  var cat=CATS.map(function(){return{rev:0,pro:0,ord:0};});
  var prod=PRODUCTS.map(function(){return{rev:0,pro:0,units:0,ord:0};});
  var sub=SUBS.map(function(){return{rev:0,pro:0,ord:0};});
  for(k=0;k<ROWS.length;k++){
    var r0=ROWS[k],m=r0[0],r=r0[1],p=r0[2],u=r0[3],s=r0[4],pr=r0[5],q=r0[6];
    var y=yearOf(m),c=PRODUCTS[p].cat;
    var yOK=(sy==='all')||(y===sy), rOK=(sr<0)||(r===sr), cOK=(sc<0)||(c===sc), a;
    if(yOK&&cOK){a=reg[r];a.rev+=s;a.pro+=pr;a.ord++;}
    if(yOK&&rOK){a=cat[c];a.rev+=s;a.pro+=pr;a.ord++;}
    if(yOK&&rOK&&cOK){
      tot.rev+=s;tot.pro+=pr;tot.ord++;tot.c.add(u);
      if(m>=0){a=month[m];a.rev+=s;a.pro+=pr;a.ord++;a.c.add(u);}
      a=prod[p];a.rev+=s;a.pro+=pr;a.units+=q;a.ord++;
      a=sub[SUBOF[p]];a.rev+=s;a.pro+=pr;a.ord++;
    }else if(sy===2025&&y===2024&&rOK&&cOK){
      prev.rev+=s;prev.pro+=pr;prev.ord++;prev.c.add(u);
    }
  }
  return {tot:tot,prev:prev,month:month,reg:reg,cat:cat,prod:prod,sub:sub};
}
function range(){return state.year==='all'?[0,NM-1]:(state.year===2024?[0,11]:[12,23]);}

/* ---------- tooltip ---------- */
var tipEl=$('#tip');
function showTip(x,y,t){
  tipEl.textContent='';
  var h=document.createElement('div');h.className='tt';h.textContent=t.title;tipEl.appendChild(h);
  t.rows.forEach(function(r){
    var d=document.createElement('div');d.className='tr';
    if(r.c){var kk=document.createElement('span');kk.className='tk';kk.style.borderTopColor=r.c;d.appendChild(kk);}
    var n=document.createElement('span');n.className='tn';n.textContent=r.k;d.appendChild(n);
    var v=document.createElement('span');v.className='tx';v.textContent=r.v;if(r.b)v.style.fontWeight='600';d.appendChild(v);
    tipEl.appendChild(d);
  });
  tipEl.classList.add('on');
  var w=tipEl.offsetWidth,hh=tipEl.offsetHeight,vw=document.documentElement.clientWidth,vh=window.innerHeight;
  var px=x+14,py=y+14;
  if(px+w>vw-8)px=x-w-14;
  if(px<8)px=8;
  if(py+hh>vh-8)py=y-hh-14;
  if(py<8)py=8;
  tipEl.style.transform='translate('+Math.round(px)+'px,'+Math.round(py)+'px)';
}
function hideTip(){tipEl.classList.remove('on');}

/* ---------- scales ---------- */
function niceStep(raw){var mag=Math.pow(10,Math.floor(Math.log10(raw))),n=raw/mag;
  return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*mag;}
function niceTicks(lo,hi,cnt){
  if(!(hi>lo))hi=lo+1;
  var st=niceStep((hi-lo)/cnt),a=Math.floor(lo/st)*st,b=Math.ceil(hi/st)*st,t=[],v;
  for(v=a;v<=b+st*1e-6;v+=st)t.push(Math.round(v*1e6)/1e6);
  return {lo:a,hi:b,ticks:t};
}
function tickFmt(v,key){
  var a=Math.abs(v),pre=key==='orders'?'':'$',s;
  if(a>=1e6){s=(a/1e6);return pre+(Math.round(s*100)/100)+'M';}
  if(a>=1e3){s=(a/1e3);return pre+(Math.round(s*10)/10)+'K';}
  return pre+(Math.round(a*10)/10);
}
function mval(b,key){return key==='revenue'?b.rev:key==='profit'?b.pro:b.ord;}

/* ---------- KPI tiles ---------- */
function spark(el,vals,col){
  var W=Math.max(80,el.clientWidth),H=36,L=4,R=8,T=6,B=6;
  if(vals.length<2){el.textContent='';return;}
  var mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals),sp=(mx-mn)||Math.abs(mx)*0.1||1;
  var lo=mn-sp*0.15,hi=mx+sp*0.15,n=vals.length,pts=[],i;
  for(i=0;i<n;i++){pts.push([L+(W-L-R)*i/(n-1),T+(H-T-B)*(1-(vals[i]-lo)/(hi-lo))]);}
  var d='M'+pts.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1);}).join(' L');
  var e=pts[n-1];
  el.innerHTML='<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" aria-hidden="true"><path d="'+d+'" fill="none" style="stroke:'+col+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="'+e[0].toFixed(1)+'" cy="'+e[1].toFixed(1)+'" r="4" class="ring" style="fill:'+col+'"/></svg>';
}
function delta(cur,prv){
  if(state.year==='all')return '<span>All 24 months</span>';
  if(state.year===2024)return '<span>Baseline year</span>';
  var d=prv?(cur-prv)/Math.abs(prv)*100:0,up=d>=0;
  return '<span class="dl '+(up?'up':'dn')+'">'+(up?'▲ +':'▼ −')+Math.abs(d).toFixed(1)+'%</span> <span>vs 2024</span>';
}
function renderKpis(a){
  var t=a.tot,p=a.prev,r=range(),n=r[1]-r[0]+1,i,dated=0;
  for(i=r[0];i<=r[1];i++)dated+=a.month[i].rev;
  var margin=t.rev?t.pro/t.rev*100:0, aov=t.ord?t.rev/t.ord:0, cust=t.c.size, opc=cust?t.ord/cust:0;
  var tiles=[
    {id:'rev',key:'revenue',hero:1,label:'Revenue',value:money(t.rev),d:delta(t.rev,p.rev),sub:'Avg '+money(dated/n)+' per month'},
    {id:'pro',key:'profit',label:'Profit',value:money(t.pro),d:delta(t.pro,p.pro),sub:pct(margin)+' margin'},
    {id:'ord',key:'orders',label:'Orders',value:int(t.ord),d:delta(t.ord,p.ord),sub:'Avg order '+moneyFull(aov)},
    {id:'cus',key:'customers',label:'Customers',value:int(cust),d:delta(cust,p.c.size),sub:opc.toFixed(1)+' orders each'}
  ];
  $('#kpis').innerHTML=tiles.map(function(x){
    return '<div class="tile'+(x.hero?' hero':'')+'"><div class="tl">'+x.label+'</div><div class="tv">'+esc(x.value)+'</div><div class="td">'+x.d+'</div><div class="td" style="margin-top:0">'+esc(x.sub)+'</div><div class="sp" id="sp-'+x.id+'"></div></div>';
  }).join('');
  var colr={rev:COL.revenue,pro:COL.profit,ord:COL.orders,cus:'var(--ink2)'};
  tiles.forEach(function(x){
    var vals=[];
    for(i=r[0];i<=r[1];i++){var b=a.month[i];vals.push(x.id==='rev'?b.rev:x.id==='pro'?b.pro:x.id==='ord'?b.ord:b.c.size);}
    spark($('#sp-'+x.id),vals,colr[x.id]);
  });
}

/* ---------- trend ---------- */
function trendTip(a,i){
  var b=a.month[i],mg=b.rev?b.pro/b.rev*100:0,key=state.metric;
  return {title:mLabel(i,true),rows:[
    {k:'Revenue',v:moneyFull(b.rev),c:COL.revenue,b:key==='revenue'},
    {k:'Profit',v:moneyFull(b.pro),c:COL.profit,b:key==='profit'},
    {k:'Margin',v:pct(mg),c:'var(--muted)'},
    {k:'Orders',v:int(b.ord),c:COL.orders,b:key==='orders'}]};
}
function renderTrend(a){
  var el=$('#trendChart'),key=state.metric,col=COL[key],r=range(),m0=r[0],m1=r[1],n=m1-m0+1,i;
  $('#trendSub').textContent=LBL[key]+' by month, '+mLabel(m0,true)+' to '+mLabel(m1,true);
  var W=Math.max(280,el.clientWidth),H=300,L=54,R=22,T=28,B=30,iw=W-L-R,ih=H-T-B;
  var vals=[];for(i=m0;i<=m1;i++)vals.push(mval(a.month[i],key));
  var mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals),sp=(mx-mn)||mx*0.1||1;
  var sc=niceTicks(Math.max(0,mn-sp*0.45),mx+sp*0.25,4);
  function X(j){return L+iw*j/(n-1);}
  function Y(v){return T+ih*(1-(v-sc.lo)/(sc.hi-sc.lo));}
  var g='';
  sc.ticks.forEach(function(t){var y=Y(t).toFixed(1);
    g+='<line class="grid-l" x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'"/><text class="tick" x="'+(L-8)+'" y="'+y+'" text-anchor="end" dominant-baseline="central">'+tickFmt(t,key)+'</text>';});
  g+='<line class="axis-l" x1="'+L+'" x2="'+(W-R)+'" y1="'+(T+ih)+'" y2="'+(T+ih)+'"/>';
  var step=n>14?3:1;
  for(i=0;i<n;i++){
    if(i%step!==0&&i!==n-1)continue;
    if(n>14&&i===n-1&&(n-1)%step!==0)continue;
    var mi=m0+i,mm=+D.months[mi].slice(5,7)-1,lab=MN[mm]+(mm===0||i===0?' ’'+D.months[mi].slice(2,4):'');
    var anc=i===0?'start':(i===n-1?'end':'middle');
    g+='<text class="tick" x="'+X(i).toFixed(1)+'" y="'+(H-8)+'" text-anchor="'+anc+'">'+lab+'</text>';
  }
  var d='M'+vals.map(function(v,j){return X(j).toFixed(1)+','+Y(v).toFixed(1);}).join(' L');
  g+='<path d="'+d+'" fill="none" style="stroke:'+col+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  var pk=vals.indexOf(mx),lw=vals.indexOf(mn);
  function ann(j,above){
    var x=X(j),y=Y(vals[j]),anc=x<90?'start':(x>W-90?'end':'middle'),tx=anc==='start'?x-2:(anc==='end'?x+2:x);
    return '<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="4" class="ring" style="fill:'+col+'"/><text class="ann" x="'+tx.toFixed(1)+'" y="'+(above?y-12:y+20).toFixed(1)+'" text-anchor="'+anc+'">'+esc(mLabel(m0+j,true)+' · '+(key==='orders'?int(vals[j]):money(vals[j])))+'</text>';
  }
  if(n>2&&pk!==lw){g+=ann(pk,true)+ann(lw,false);}
  var last=n-1;
  if(last!==pk&&last!==lw)g+='<circle cx="'+X(last).toFixed(1)+'" cy="'+Y(vals[last]).toFixed(1)+'" r="4" class="ring" style="fill:'+col+'"/>';
  g+='<g id="hv" style="display:none"><line class="cross" id="hvl" y1="'+T+'" y2="'+(T+ih)+'"/><circle id="hvc" r="5" class="ring" style="fill:'+col+'"/></g>';
  g+='<rect class="hit" x="'+L+'" y="0" width="'+iw+'" height="'+(T+ih)+'"/>';
  el.innerHTML='<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" tabindex="0" role="img" aria-label="'+esc(LBL[key])+' by month. Use left and right arrow keys to read each month.">'+g+'</svg>';
  var svg=el.querySelector('svg'),hv=svg.querySelector('#hv'),hl=svg.querySelector('#hvl'),hc=svg.querySelector('#hvc'),cur=-1;
  function at(j,cx,cy){
    j=Math.max(0,Math.min(n-1,j));cur=j;
    hv.style.display='';hl.setAttribute('x1',X(j));hl.setAttribute('x2',X(j));hc.setAttribute('cx',X(j));hc.setAttribute('cy',Y(vals[j]));
    showTip(cx,cy,trendTip(a,m0+j));
  }
  svg.addEventListener('pointermove',function(e){var b=svg.getBoundingClientRect();at(Math.round((e.clientX-b.left-L)/iw*(n-1)),e.clientX,e.clientY);});
  svg.addEventListener('pointerleave',function(){hv.style.display='none';hideTip();});
  svg.addEventListener('keydown',function(e){
    if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight')return;e.preventDefault();
    var j=cur<0?(e.key==='ArrowLeft'?n-1:0):cur+(e.key==='ArrowRight'?1:-1),b=svg.getBoundingClientRect();
    at(j,b.left+X(Math.max(0,Math.min(n-1,j))),b.top+Y(vals[Math.max(0,Math.min(n-1,j))]));
  });
  svg.addEventListener('blur',function(){hv.style.display='none';hideTip();});
  var rows=[];for(i=m0;i<=m1;i++){var b=a.month[i];rows.push([mLabel(i,true),moneyFull(b.rev),moneyFull(b.pro),pct(b.rev?b.pro/b.rev*100:0),int(b.ord)]);}
  table($('#trendTable'),['Month','Revenue','Profit','Margin','Orders'],rows);
}

/* ---------- horizontal bars ---------- */
function hbars(el,items,o){
  var W=Math.max(260,el.clientWidth),labelW=Math.round(Math.min(124,W*0.34)),rowH=o.rowH||42,barH=o.barH||20,padT=2;
  var x0=labelW+8,barMax=Math.max(40,W-x0-o.valW),mx=1,g='',H;
  items.forEach(function(it){if(it.value>mx)mx=it.value;});
  items.forEach(function(it,i){
    var y=padT+i*rowH,cy=y+rowH/2,by=cy-barH/2,w=Math.max(3,Math.round(barMax*Math.max(it.value,0)/mx)),r=Math.min(4,w/2);
    var dd='M'+x0+','+by+'h'+(w-r)+'a'+r+','+r+' 0 0 1 '+r+','+r+'v'+(barH-2*r)+'a'+r+','+r+' 0 0 1 '+(-r)+','+r+'h'+(-(w-r))+'z';
    var dim=o.selected!==-1&&o.selected!==it.key;
    g+='<g class="hrow'+(dim?' dim':'')+'" data-i="'+i+'"'+(o.plain?' style="cursor:default"':' tabindex="0" role="button" aria-pressed="'+(o.selected===it.key)+'"')+' aria-label="'+esc(it.label+': '+it.valText+', margin '+it.subText)+'">'
      +'<rect class="hit" x="0" y="'+y+'" width="'+W+'" height="'+rowH+'"/>'
      +'<text class="lbl" x="0" y="'+cy+'" dominant-baseline="central">'+esc(it.label)+'</text>'
      +'<path class="bar" d="'+dd+'" style="fill:'+o.color+'"/>'
      +'<text class="val" x="'+(x0+w+8)+'" y="'+cy+'" dominant-baseline="central">'+esc(it.valText)+'<tspan class="valsub" dx="6">'+esc(it.subText)+'</tspan></text></g>';
  });
  H=padT+items.length*rowH+2;
  el.innerHTML='<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" role="group" aria-label="'+esc(o.aria)+'">'+g+'</svg>';
  el.querySelectorAll('.hrow').forEach(function(gr){
    var it=items[+gr.getAttribute('data-i')];
    gr.addEventListener('pointermove',function(e){showTip(e.clientX,e.clientY,it.tip);});
    gr.addEventListener('pointerleave',hideTip);
    gr.addEventListener('focus',function(){var b=gr.getBoundingClientRect();showTip(b.left+b.width/2,b.top+b.height/2,it.tip);});
    gr.addEventListener('blur',hideTip);
    if(!o.onPick)return;
    gr.addEventListener('click',function(){hideTip();o.onPick(it.key);});
    gr.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();hideTip();o.onPick(it.key);}});
  });
}
function groupItems(names,agg,key){
  return agg.map(function(x,i){
    var mg=x.rev?x.pro/x.rev*100:0;
    return {key:i,label:names[i],value:key==='profit'?x.pro:x.rev,
      valText:money(key==='profit'?x.pro:x.rev),subText:pct(mg),
      tip:{title:names[i],rows:[
        {k:'Revenue',v:moneyFull(x.rev),c:COL.revenue,b:key==='revenue'},
        {k:'Profit',v:moneyFull(x.pro),c:COL.profit,b:key==='profit'},
        {k:'Margin',v:pct(mg),c:'var(--muted)'},
        {k:'Orders',v:int(x.ord),c:COL.orders}]},
      row:[names[i],moneyFull(x.rev),moneyFull(x.pro),pct(mg),int(x.ord)]};
  }).sort(function(p,q){return q.value-p.value;});
}
function renderRegion(a){
  var it=groupItems(REGIONS,a.reg,'profit');
  hbars($('#regionChart'),it,{color:COL.profit,valW:116,rowH:56,barH:22,selected:state.region,aria:'Profit by region',
    onPick:function(k){state.region=(state.region===k?-1:k);render();}});
  table($('#regionTable'),['Region','Revenue','Profit','Margin','Orders'],it.map(function(x){return x.row;}));
}
function renderCat(a){
  var it=groupItems(CATS,a.cat,'revenue');
  hbars($('#catChart'),it,{color:COL.revenue,valW:116,selected:state.cat,aria:'Revenue by category',
    onPick:function(k){state.cat=(state.cat===k?-1:k);render();}});
  table($('#catTable'),['Category','Revenue','Profit','Margin','Orders'],it.map(function(x){return x.row;}));
}
function renderSubs(a){
  var it=groupItems(SUBS,a.sub,'revenue').filter(function(x){return a.sub[x.key].ord>0;});
  hbars($('#subChart'),it,{color:COL.revenue,valW:116,rowH:30,barH:14,plain:true,selected:-1,aria:'Revenue by sub-category'});
}

/* ---------- top products ---------- */
var FLAG='<svg viewBox="0 0 10 10" aria-hidden="true"><path d="M5 1L9.5 9H.5z" style="fill:var(--warn)"/></svg>';
function renderProducts(a){
  var el=$('#prods'),key=state.rank,fk=key==='revenue'?'rev':'pro',t=a.tot,avg=t.rev?t.pro/t.rev*100:0;
  var list=[];a.prod.forEach(function(p,i){if(p.ord>0)list.push({i:i,p:p});});
  list.sort(function(x,y){return y.p[fk]-x.p[fk];});list=list.slice(0,10);
  el.textContent='';
  if(!list.length){var e=document.createElement('p');e.className='empty';e.textContent='No orders match these filters.';el.appendChild(e);return;}
  var mx=Math.max(list[0].p[fk],1),box=document.createElement('div');box.className='prows';
  list.forEach(function(x,idx){
    var p=x.p,pd=PRODUCTS[x.i],mg=p.rev?p.pro/p.rev*100:0,low=mg<avg-3;
    var row=document.createElement('div');row.className='prow';
    var rk=document.createElement('span');rk.className='prk';rk.textContent=String(idx+1);row.appendChild(rk);
    var nm=document.createElement('div');nm.className='pn';nm.textContent=pd.name;
    var sm=document.createElement('small');sm.textContent=CATS[pd.cat]+' · '+pd.sub;nm.appendChild(sm);row.appendChild(nm);
    var tr=document.createElement('div');tr.className='ptrack';var f=document.createElement('div');f.className='pfill';
    f.style.width=Math.max(2,p[fk]/mx*100)+'%';f.style.background=COL[key];tr.appendChild(f);row.appendChild(tr);
    var pv=document.createElement('span');pv.className='pv';pv.textContent=money(p[fk]);row.appendChild(pv);
    var pm=document.createElement('span');pm.className='pm';
    if(low){var fl=document.createElement('span');fl.className='flag';fl.innerHTML=FLAG;var ft=document.createElement('span');ft.textContent='Below avg';fl.appendChild(ft);pm.appendChild(fl);}
    var mv=document.createElement('span');mv.className='mv';mv.textContent=pct(mg);pm.appendChild(mv);row.appendChild(pm);
    var tip={title:pd.name,rows:[
      {k:'Category',v:CATS[pd.cat]},{k:'Sub-category',v:pd.sub},
      {k:'Revenue',v:moneyFull(p.rev),c:COL.revenue,b:key==='revenue'},
      {k:'Profit',v:moneyFull(p.pro),c:COL.profit,b:key==='profit'},
      {k:'Margin',v:pct(mg)+(low?' (below avg)':''),c:'var(--muted)'},
      {k:'Units',v:int(p.units)},{k:'Orders',v:int(p.ord),c:COL.orders}]};
    row.addEventListener('pointermove',function(e){showTip(e.clientX,e.clientY,tip);});
    row.addEventListener('pointerleave',hideTip);
    box.appendChild(row);
  });
  el.appendChild(box);
}

/* ---------- table views ---------- */
function table(el,cols,rows){
  el.textContent='';
  var t=document.createElement('table'),th=document.createElement('thead'),tr=document.createElement('tr');
  cols.forEach(function(c){var h=document.createElement('th');h.scope='col';h.textContent=c;tr.appendChild(h);});
  th.appendChild(tr);t.appendChild(th);
  var tb=document.createElement('tbody');
  rows.forEach(function(r){var x=document.createElement('tr');r.forEach(function(c){var d=document.createElement('td');d.textContent=c;x.appendChild(d);});tb.appendChild(x);});
  t.appendChild(tb);el.appendChild(t);
}
function applyViews(){
  [['trend','#trendChart','#trendTable'],['region','#regionChart','#regionTable'],['cat','#catChart','#catTable']].forEach(function(v){
    var on=state.view[v[0]];$(v[1]).hidden=on;$(v[2]).hidden=!on;
    var b=document.querySelector('[data-view="'+v[0]+'"]');b.textContent=on?'Chart':'Table';b.setAttribute('aria-pressed',String(on));
  });
}

/* ---------- controls ---------- */
function seg(el,opts,get,set){
  el.innerHTML=opts.map(function(o){return '<button type="button" role="radio" data-v="'+esc(o.v)+'" aria-checked="false">'+esc(o.t)+'</button>';}).join('');
  el.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;set(b.getAttribute('data-v'));render();});
  el._sync=function(){el.querySelectorAll('button').forEach(function(b){b.setAttribute('aria-checked',String(b.getAttribute('data-v')===String(get())));});};
}
function initControls(){
  seg($('#yearSeg'),[{v:'all',t:'All years'},{v:'2024',t:'2024'},{v:'2025',t:'2025'}],function(){return String(state.year);},function(v){state.year=v==='all'?'all':+v;});
  seg($('#metricSeg'),[{v:'revenue',t:'Revenue'},{v:'profit',t:'Profit'},{v:'orders',t:'Orders'}],function(){return state.metric;},function(v){state.metric=v;});
  seg($('#rankSeg'),[{v:'revenue',t:'Revenue'},{v:'profit',t:'Profit'}],function(){return state.rank;},function(v){state.rank=v;});
  var rs=$('#regionSel'),cs=$('#catSel');
  rs.innerHTML='<option value="-1">All regions</option>'+REGIONS.map(function(n,i){return '<option value="'+i+'">'+esc(n)+'</option>';}).join('');
  cs.innerHTML='<option value="-1">All categories</option>'+CATS.map(function(n,i){return '<option value="'+i+'">'+esc(n)+'</option>';}).join('');
  rs.addEventListener('change',function(){state.region=+rs.value;render();});
  cs.addEventListener('change',function(){state.cat=+cs.value;render();});
  $('#reset').addEventListener('click',function(){state.year='all';state.region=-1;state.cat=-1;render();});
  document.querySelectorAll('[data-view]').forEach(function(b){
    b.addEventListener('click',function(){var k=b.getAttribute('data-view');state.view[k]=!state.view[k];applyViews();});
  });
  $('#scope').textContent='E-commerce sales, Jan 2024 to Dec 2025 · '+D.meta.customers.toLocaleString('en-US')+' customers · '+D.meta.products+' products · '+D.meta.states+' states';
}
function render(){
  var a=aggregate();
  $('#yearSeg')._sync();$('#metricSeg')._sync();$('#rankSeg')._sync();
  $('#regionSel').value=String(state.region);$('#catSel').value=String(state.cat);
  $('#reset').hidden=(state.year==='all'&&state.region<0&&state.cat<0);
  var c=$('#count');c.innerHTML='<b>'+int(a.tot.ord)+'</b> orders in view · <b>'+money(a.tot.rev)+'</b> revenue';
  hideTip();
  renderKpis(a);renderTrend(a);renderRegion(a);renderCat(a);renderSubs(a);renderProducts(a);applyViews();
}
initControls();render();
var rt=0,lastW=document.querySelector('.wrap').clientWidth;
if(window.ResizeObserver){new ResizeObserver(function(){
  var w=document.querySelector('.wrap').clientWidth;if(w===lastW)return;lastW=w;
  cancelAnimationFrame(rt);rt=requestAnimationFrame(render);
}).observe(document.querySelector('.wrap'));}
})();
</script>
